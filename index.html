<!DOCTYPE html><html lang=ru><head><meta charset=UTF-8><title>Конструктор сайтов</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{height:100vh;display:flex;flex-direction:column;background:#0e1015;color:#e6e8ec;overflow:hidden}
header{height:52px;background:#16181f;border-bottom:1px solid #24262f;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
header h1{font-size:14px;font-weight:600;margin-right:auto}
header h1 span{color:#1a73e8}
.btn{padding:8px 16px;border:0;border-radius:7px;background:#24262f;color:#e6e8ec;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:#2e313c}
.btn.p{background:#1a73e8;color:#fff}
.btn.p:hover{background:#1765cc}
#app{flex:1;display:flex;overflow:hidden}
aside{width:200px;background:#16181f;border-right:1px solid #24262f;padding:12px;overflow-y:auto;flex-shrink:0}
aside.r{border-right:0;border-left:1px solid #24262f;width:240px}
aside h2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6b7382;font-weight:700;margin-bottom:10px}
.pal{display:flex;flex-direction:column;gap:6px}
.pal button{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid #24262f;border-radius:8px;background:#1c1e27;color:#e6e8ec;font-size:12px;text-align:left;cursor:pointer;transition:.15s}
.pal button:hover{background:#252833;border-color:#3b5a8c}
.pal button b{font-size:15px;width:18px;text-align:center}
.pg-row{display:flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid #24262f;border-radius:7px;background:#1c1e27;font-size:11.5px;cursor:pointer;margin-bottom:4px}
.pg-row:hover{background:#252833}
.pg-row.on{background:#1f2a3d;border-color:#3b5a8c}
.pg-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-row .del{opacity:.4;font-size:11px;padding:0 3px;cursor:pointer}
.pg-row .del:hover{opacity:1;color:#ff7b72}
.addpg{width:100%;padding:6px;border:1px dashed #2e313c;border-radius:7px;background:transparent;color:#8b93a3;font-size:11px;cursor:pointer;font-family:inherit;margin-bottom:14px}
.addpg:hover{border-color:#3b5a8c;color:#e6e8ec}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:#0a0c10;overflow:hidden;gap:14px}
.sizer{display:flex;align-items:center;gap:10px;background:#16181f;border:1px solid #24262f;border-radius:10px;padding:8px 14px;flex-shrink:0}
.sizer label{font-size:11px;color:#8b93a3;font-weight:600}
.sizer input[type=range]{width:200px;accent-color:#1a73e8;cursor:pointer}
.sizer input[type=number]{width:70px;padding:5px 8px;border:1px solid #2e313c;border-radius:6px;background:#1c1e27;color:#e6e8ec;font-size:12px;font-family:inherit;outline:0;text-align:center}
.sizer .dims{font-size:11px;color:#1a73e8;font-weight:700;min-width:70px;text-align:center}
.sizer .preset{padding:5px 10px;border:1px solid #2e313c;border-radius:6px;background:transparent;color:#8b93a3;font-size:11px;cursor:pointer;font-family:inherit}
.sizer .preset:hover{color:#e6e8ec;border-color:#3b5a8c}
.sizer .preset.on{background:#1a73e8;color:#fff;border-color:#1a73e8}
.phone-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}
#phone{background:#fff;border-radius:32px;border:8px solid #1a1c22;box-shadow:0 20px 60px #000a;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:width .25s;height:min(680px,100%)}
#phone::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:100px;height:20px;background:#1a1c22;border-radius:0 0 12px 12px;z-index:2}
#canvas{flex:1;overflow-y:auto;padding:30px 16px 16px;background:#fff;color:#222;font-size:13px}
#canvas:empty::before{content:"Нажмите элементы слева, чтобы добавить их сюда";display:block;text-align:center;color:#999;font-size:11px;margin-top:40px;padding:0 20px;line-height:1.5}
.el{padding:6px;border-radius:6px;margin:2px 0;border:1px dashed transparent;cursor:pointer}
.el:hover{border-color:#1a73e855}
.el.on{border-color:#1a73e8;background:#1a73e80d}
.el h1{font-size:20px;margin:4px 0;word-wrap:break-word}
.el p{margin:4px 0;line-height:1.5;color:#444;word-wrap:break-word}
.el button{padding:9px 16px;border:0;border-radius:7px;background:#1a73e8;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;max-width:100%}
.el button:hover{background:#1765cc}
.el input{padding:9px 12px;border:1px solid #ccc;border-radius:7px;font-size:13px;width:100%;font-family:inherit;outline:0}
.el img{max-width:100%;border-radius:7px;display:block}
.el hr{border:0;border-top:1px solid #ddd;margin:8px 0}
.prop{margin-bottom:10px}
.prop label{display:block;font-size:10.5px;color:#8b93a3;margin-bottom:4px}
.prop input,.prop select,.prop textarea{width:100%;padding:7px 9px;border:1px solid #2e313c;border-radius:6px;background:#1c1e27;color:#e6e8ec;font-size:12px;font-family:inherit;outline:0}
.prop textarea{resize:vertical;min-height:55px}
.prop .hint{font-size:10px;color:#5f6672;margin-top:4px;line-height:1.4}
.row{display:flex;gap:6px}.row .btn{flex:1;padding:7px 10px;font-size:11px}
.empty{font-size:11px;color:#5f6672;text-align:center;padding:20px 0;line-height:1.5}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#1a73e8;color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:500;opacity:0;transition:.3s;z-index:100;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header>
  <h1>🛠️ Конструктор <span>сайтов</span></h1>
  <button class=btn id=newBtn>➕ Создать HTML</button>
  <button class="btn p" id=buildBtn>⬇ Собрать HTML</button>
</header>
<div id=app>
  <aside>
    <h2>Страницы</h2>
    <div id=pages></div>
    <button class=addpg id=addpg>+ Добавить страницу</button>
    <h2>Элементы</h2>
    <div class=pal>
      <button data-add=h><b>H</b>Заголовок</button>
      <button data-add=p><b>¶</b>Абзац</button>
      <button data-add=b><b>▢</b>Кнопка</button>
      <button data-add=i><b>▭</b>Поле ввода</button>
      <button data-add=img><b>🖼</b>Картинка</button>
      <button data-add=hr><b>—</b>Разделитель</button>
    </div>
  </aside>
  <main>
    <div class=sizer>
      <label>Ширина</label>
      <input type=range id=wRange min=260 max=520 value=330>
      <input type=number id=wNum min=260 max=520 value=330>
      <span class=dims id=dims>330 px</span>
      <button class=preset data-w=320>320</button>
      <button class=preset data-w=375>375</button>
      <button class=preset data-w=414>414</button>
      <button class=preset data-w=480>480</button>
    </div>
    <div class=phone-wrap><div id=phone style=width:330px><div id=canvas></div></div></div>
  </main>
  <aside class=r>
    <h2>Свойства</h2>
    <div id=props></div>
  </aside>
</div>
<div id=toast></div>
<script>
const $=s=>document.querySelector(s);
const S={pages:[{f:'index.html',t:'Главная',els:[]}],pi:0,sel:null,i:1,width:330};
const canvas=$('#canvas'),phone=$('#phone');
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2200)}
const P=()=>S.pages[S.pi];

function setWidth(w){
  w=Math.max(260,Math.min(520,Math.round(w)||330));
  S.width=w;phone.style.width=w+'px';
  $('#wRange').value=w;$('#wNum').value=w;$('#dims').textContent=w+' px';
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',+b.dataset.w===w));
}

function add(type){
  const e={id:S.i++,type};
  if(type==='h') e.text='Заголовок';
  if(type==='p') e.text='Текст абзаца. Нажмите, чтобы отредактировать.';
  if(type==='b'){e.text='Нажми меня';e.action='toast';e.payload='Привет!';e.ms=10000;e.target=''}
  if(type==='i') e.placeholder='Введите текст…';
  if(type==='img') e.src='https://placehold.co/400x200/1a73e8/fff?text=Image';
  P().els.push(e);S.sel=e.id;render();
}
function del(id){P().els=P().els.filter(e=>e.id!==id);if(S.sel===id)S.sel=null;render()}
function move(id,d){const a=P().els,i=a.findIndex(e=>e.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function upd(id,k,v){const e=P().els.find(x=>x.id===id);if(e){e[k]=v;render()}}

function renderEl(e){
  const on=e.id===S.sel?' on':'';
  let inner='';
  if(e.type==='h') inner=`<h1>${E(e.text)}</h1>`;
  else if(e.type==='p') inner=`<p>${E(e.text)}</p>`;
  else if(e.type==='b'){
    const a=e.action==='timer'?`data-act="timer" data-ms="${e.ms||10000}"`:
            e.action==='page'?`data-act="page" data-target="${E(e.target||'')}"`:
            `data-act="${e.action}" data-payload="${E(e.payload||'')}"`;
    inner=`<button ${a}>${E(e.text)}</button>`;
  }
  else if(e.type==='i') inner=`<input placeholder="${E(e.placeholder)}">`;
  else if(e.type==='img') inner=`<img src="${E(e.src)}" alt="">`;
  else if(e.type==='hr') inner='<hr>';
  return `<div class="el${on}" data-el="${e.id}">${inner}</div>`;
}
function renderPages(){
  $('#pages').innerHTML=S.pages.map((p,i)=>`
    <div class="pg-row ${i===S.pi?'on':''}" data-p="${i}">
      <span>📄</span><span class=nm>${E(p.t)}</span>
      ${S.pages.length>1?`<span class=del data-dp="${i}">✕</span>`:''}
    </div>`).join('');
}
function renderProps(){
  const p=$('#props'),e=P().els.find(x=>x.id===S.sel);
  if(!e){p.innerHTML='<div class=empty>Выберите элемент в телефоне</div>';return}
  let h='';
  if(e.type==='h'||e.type==='p') h+=`<div class=prop><label>Текст</label><textarea data-k=text>${E(e.text)}</textarea></div>`;
  if(e.type==='b'){
    h+=`<div class=prop><label>Текст кнопки</label><input data-k=text value="${E(e.text)}"></div>`;
    h+=`<div class=prop><label>Действие</label><select data-k=action>
      <option value=toast ${e.action==='toast'?'selected':''}>Toast</option>
      <option value=alert ${e.action==='alert'?'selected':''}>Alert</option>
      <option value=timer ${e.action==='timer'?'selected':''}>Таймер</option>
      <option value=link ${e.action==='link'?'selected':''}>Ссылка</option>
      <option value=page ${e.action==='page'?'selected':''}>🔗 Страница сайта</option>
    </select></div>`;
    if(e.action==='toast'||e.action==='alert') h+=`<div class=prop><label>Сообщение</label><input data-k=payload value="${E(e.payload||'')}"></div>`;
    if(e.action==='timer') h+=`<div class=prop><label>Миллисекунды</label><input type=number data-k=ms value="${e.ms||10000}" min=100 step=100></div>`;
    if(e.action==='link') h+=`<div class=prop><label>URL</label><input data-k=payload value="${E(e.payload||'')}" placeholder="https://…"></div>`;
    if(e.action==='page') h+=`<div class=prop><label>Куда перейти</label><select data-k=target>
      <option value="">— выберите —</option>
      ${S.pages.map(pg=>`<option value="${E(pg.f)}" ${e.target===pg.f?'selected':''}>${E(pg.t)} (${E(pg.f)})</option>`).join('')}
    </select></div>`;
  }
  if(e.type==='i') h+=`<div class=prop><label>Placeholder</label><input data-k=placeholder value="${E(e.placeholder)}"></div>`;
  if(e.type==='img') h+=`<div class=prop><label>URL картинки</label><input data-k=src value="${E(e.src)}"></div>`;
  h+=`<div class=row style=margin-top:14px><button class=btn data-m=-1>↑ Вверх</button><button class=btn data-m=1>↓ Вниз</button></div>
  <div class=row style=margin-top:6px><button class=btn data-del style="color:#ff7b72">🗑 Удалить</button></div>`;
  p.innerHTML=h;
}
function render(){renderPages();canvas.innerHTML=P().els.map(renderEl).join('');renderProps()}

canvas.addEventListener('click',e=>{
  const el=e.target.closest('[data-el]');
  if(el){const id=+el.dataset.el;
    if(S.sel!==id){S.sel=id;
      canvas.querySelectorAll('.el').forEach(x=>x.classList.toggle('on',+x.dataset.el===id));
      renderProps();}}
  const b=e.target.closest('[data-act]');if(b) runAction(b);
});
function runAction(b){
  const a=b.dataset.act;
  if(a==='toast') toast(b.dataset.payload||'');
  else if(a==='alert') alert(b.dataset.payload||'');
  else if(a==='timer') runTimer(b,+b.dataset.ms||10000);
  else if(a==='link') window.open(b.dataset.payload||'about:blank','_blank');
  else if(a==='page'){const t=b.dataset.target;if(!t){toast('Выберите страницу');return}
    const i=S.pages.findIndex(p=>p.f===t);if(i>=0){S.pi=i;S.sel=null;render();toast('→ '+P().t)}}
}
function runTimer(btn,ms){
  if(btn.disabled) return;
  const orig=btn.textContent;btn.disabled=true;const t0=Date.now();
  const iv=setInterval(()=>{
    const l=ms-(Date.now()-t0);
    if(l<=0){clearInterval(iv);btn.disabled=false;btn.textContent=orig;toast('⏱ Таймер завершён');return}
    btn.textContent=(l/1000).toFixed(1)+'с';
  },50);
}

$('#props').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;upd(S.sel,k,e.target.type==='number'?+e.target.value:e.target.value)});
$('#props').addEventListener('change',e=>{const k=e.target.dataset.k;if(k)upd(S.sel,k,e.target.value)});
$('#props').addEventListener('click',e=>{
  const m=e.target.closest('[data-m]');if(m){move(S.sel,+m.dataset.m);return}
  if(e.target.closest('[data-del]')) del(S.sel);
});
document.querySelector('.pal').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)add(b.dataset.add)});

/* Страницы */
$('#pages').addEventListener('click',e=>{
  const d=e.target.closest('[data-dp]');
  if(d){e.stopPropagation();
    if(!confirm('Удалить страницу?'))return;
    S.pages.splice(+d.dataset.dp,1);
    if(S.pi>=S.pages.length)S.pi=S.pages.length-1;
    S.sel=null;render();return}
  const r=e.target.closest('[data-p]');if(r){S.pi=+r.dataset.p;S.sel=null;render()}
});
$('#addpg').addEventListener('click',()=>{
  const n=S.pages.length+1;
  S.pages.push({f:'page'+n+'.html',t:'Страница '+n,els:[]});
  S.pi=S.pages.length-1;S.sel=null;render();toast('page'+n+'.html');
});

$('#newBtn').addEventListener('click',()=>{
  if(S.pages.some(p=>p.els.length)&&!confirm('Очистить проект?'))return;
  S.pages=[{f:'index.html',t:'Главная',els:[]}];S.pi=0;S.sel=null;S.i=1;render();toast('Новый проект');
});

/* Сборка — скачивает все страницы */
$('#buildBtn').addEventListener('click',()=>{
  if(!S.pages.some(p=>p.els.length)){toast('Пусто');return}
  const css=`*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;max-width:${S.width}px;margin:0 auto;padding:24px 16px;color:#222;line-height:1.5}
h1{font-size:24px;margin:16px 0 8px}
p{margin:8px 0;color:#444}
button{padding:11px 20px;border:0;border-radius:8px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer;font-family:inherit;margin:6px 0}
button:hover{background:#1765cc}
button:disabled{opacity:.7;cursor:default}
input{padding:11px 14px;border:1px solid #ccc;border-radius:8px;font-size:14px;width:100%;font-family:inherit;outline:0;margin:6px 0}
img{max-width:100%;border-radius:8px;margin:6px 0;display:block}
hr{border:0;border-top:1px solid #ddd;margin:16px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#1a73e8;color:#fff;padding:12px 22px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}`;
  const js=`function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('on')},2200)}
function runTimer(b,ms){if(b.disabled)return;var o=b.textContent;b.disabled=true;var t0=Date.now();var iv=setInterval(function(){var l=ms-(Date.now()-t0);if(l<=0){clearInterval(iv);b.disabled=false;b.textContent=o;toast('⏱ Таймер завершён');return}b.textContent=(l/1000).toFixed(1)+'с'},50)}
document.body.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
if(a==='toast')toast(b.dataset.payload||'');
else if(a==='alert')alert(b.dataset.payload||'');
else if(a==='timer')runTimer(b,+b.dataset.ms||10000);
else if(a==='link')location.href=b.dataset.payload||'#';
else if(a==='page'){if(b.dataset.target)location.href=b.dataset.target}});`;
  S.pages.forEach(p=>{
    const body=p.els.map(exportEl).join('\n');
    const html=`<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${E(p.t)}</title>
<style>${css}<\/style></head><body>
${body}
<div id="toast"></div>
<script>${js}<\/script>
</body></html>`;
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.f;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  });
  toast('✅ Скачано: '+S.pages.length+' файлов');
});

function exportEl(e){
  if(e.type==='h') return `<h1>${E(e.text)}</h1>`;
  if(e.type==='p') return `<p>${E(e.text)}</p>`;
  if(e.type==='b'){
    const a=e.action;
    const at=a==='timer'?`data-act="timer" data-ms="${e.ms||10000}"`:
             a==='page'?`data-act="page" data-target="${E(e.target||'')}"`:
             `data-act="${a}" data-payload="${E(e.payload||'')}"`;
    return `<button ${at}>${E(e.text)}</button>`;
  }
  if(e.type==='i') return `<input placeholder="${E(e.placeholder)}">`;
  if(e.type==='img') return `<img src="${E(e.src)}" alt="">`;
  if(e.type==='hr') return '<hr>';
  return '';
}

$('#wRange').addEventListener('input',e=>setWidth(+e.target.value));
$('#wNum').addEventListener('input',e=>setWidth(+e.target.value));
document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>setWidth(+b.dataset.w)));

setWidth(330);
render();
</script></body></html>
